spring.application.name=buukien
server.port=8080

# Giá trị thật nằm trong application-local.properties (không đưa lên GitHub)
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5433/parcel_db
spring.datasource.username=parcel_admin
spring.datasource.password=your_password_here

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
app.jwt.secret=your_jwt_secret_here
app.jwt.het-han-phut=60
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=parcel_mq
spring.rabbitmq.password=your_rabbitmq_password_here


# --- Gmail SMTP (gửi OTP quên mật khẩu) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.otp.dev-in-console=false